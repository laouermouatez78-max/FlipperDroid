name: Import FlipperDroid upstream

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-flipperdroid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4

      - name: Clone Jeremiznoo/FlipperDroid
        run: |
          git clone --depth 1 https://github.com/Jeremiznoo/FlipperDroid.git /tmp/flipperdroid-upstream

      - name: Import clean project source
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          rsync -a \
            --exclude='.git/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='build/' \
            --exclude='local.properties' \
            /tmp/flipperdroid-upstream/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
          else
            git commit -m "Import current FlipperDroid source from Jeremiznoo"
            git push origin HEAD:main
          fi
