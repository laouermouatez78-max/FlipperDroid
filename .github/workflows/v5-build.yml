name: Build FlipperDroid V5 APK

on:
  push:
    branches: [ v5-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct V5 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .v5src/chunk00.b64 \
            .v5src/chunk01.b64 \
            .v5payload/part01.b64 \
            .v5payload/part02.b64 \
            .v5payload/part03a.b64 \
            .v5payload/part03b.b64 \
            .v5payload/part04.b64 \
            .v5payload/part05a.b64 \
            .v5payload/part05b.b64 \
            .v5payload/part06.b64 > /tmp/v5.b64
          base64 --decode /tmp/v5.b64 > /tmp/FlipperDroid-V5-SOURCE.zip
          echo "Archive SHA-256: $(sha256sum /tmp/FlipperDroid-V5-SOURCE.zip | cut -d' ' -f1)"
          test "$(sha256sum /tmp/FlipperDroid-V5-SOURCE.zip | cut -d' ' -f1)" = "c5ecbe73274eec30032f9f6c357df6e9496575df40d05a66f93459e308554092"
          mkdir -p /tmp/v5src
          unzip -q /tmp/FlipperDroid-V5-SOURCE.zip -d /tmp/v5src
          test -f /tmp/v5src/FlipperDroid_V5/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V5 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v5src/FlipperDroid_V5
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FlipperDroid-V5-5.0.0-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/FlipperDroid-V5-5.0.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipperDroid-V5-debug
          path: FlipperDroid-V5-5.0.0-debug.apk
          if-no-files-found: error
          retention-days: 7
